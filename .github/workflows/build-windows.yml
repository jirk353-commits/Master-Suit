name: Build Master Suite (64-bit + 32-bit) and release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_NAME: "Master Suite"
  CMAKE_TARGET: MasterSuite_VST3
  ARTEFACTS: MasterSuite_artefacts
  FILE_BASE: Master-Suite
  OLD_NAME: ""

jobs:
  build:
    name: ${{ matrix.bits }}-bit
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { bits: "64", arch: x64,   guid: "AF737EA3-C18F-49C6-975A-60CAF16CFC8D" }
          - { bits: "32", arch: Win32, guid: "C36383DA-6BC9-4F6B-81D1-8E4F7354EBE8" }
    steps:
      - uses: actions/checkout@v5

      - name: Configure (MSVC ${{ matrix.arch }})
        run: cmake -S . -B build -A ${{ matrix.arch }}

      - name: Build plugin
        run: cmake --build build --config Release --target ${{ env.CMAKE_TARGET }} --parallel

      - name: Build ${{ matrix.bits }}-bit setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ws = $env:GITHUB_WORKSPACE
          $a = @(
            "/DAppName=$env:PLUGIN_NAME",
            "/DArch=${{ matrix.bits }}",
            "/DAppIdGuid=${{ matrix.guid }}",
            "/DArtDir=$ws\Installer",
            "/DPluginDir=$ws\build\$env:ARTEFACTS\Release\VST3\$env:PLUGIN_NAME.vst3",
            "/DOutName=$env:FILE_BASE-Setup-${{ matrix.bits }}bit",
            "/O$ws\out"
          )
          if ($env:OLD_NAME -ne "") { $a += "/DOldName=$env:OLD_NAME" }
          & $iscc @a "Installer\setup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v5
        with:
          name: setup-${{ matrix.bits }}bit
          path: out/*.exe

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          for t in $(gh release list --json tagName -q '.[].tagName'); do gh release delete "$t" --yes --cleanup-tag || true; done
          cat > notes.md <<NOTES
          ## ${PLUGIN_NAME} by ROHIT JI - VST3 for Windows

          | Download | Use it for |
          |---|---|
          | **${FILE_BASE}-Setup-64bit.exe** | 64-bit FL Studio, Cubase and other modern DAWs (most people need this one) |
          | **${FILE_BASE}-Setup-32bit.exe** | Older 32-bit DAWs only |

          Run the setup and click **Next > Install > Finish**. Then rescan plugins in your DAW.

          ### New in v1.1.0
          - Only the modules you use are shown: EQ, DYNAMICS and LOUDNESS are always there, REBALANCE / EXCITER / IMAGER are added with **+ ADD MODULE** and removed with **x**
          - The 32-bit setup now warns on 64-bit Windows (Cubase only loads the 64-bit version)

          ### Inside Master Suite
          - **EQ** (always on): 6-band parametric, every band works on Stereo / Mid / Side / Left / Right, band LISTEN, live spectrum (mid + side)
          - **DYNAMICS** (always on): 4-band clean compressor + GLUE bus compressor, flat with no colour, per-band channel mode, band SOLO
          - **LOUDNESS** (always on): EBU R128 LUFS meter (integrated, short-term, momentary, LRA, true peak) + true-peak maximizer, targets for Spotify, YouTube, Apple Music, Amazon Music, Tidal, Deezer, SoundCloud, CD/Club, Custom, MATCH TARGET button
          - **REBALANCE** (optional): move whole bands up/down, per-band channel mode
          - **EXCITER** (optional): 4-band harmonics with Tube / Tape / Transformer / Console / Crystal emulation, per-band channel mode
          - **IMAGER** (optional): 4-band width, vectorscope, correlation meter, per-band phase check, width-by-frequency view
          - LISTEN to Stereo / Mid / Side / Left / Right at the output
          NOTES
          sed -i 's/^          //' notes.md
          gh release create v1.1.0 out/${FILE_BASE}-Setup-64bit.exe out/${FILE_BASE}-Setup-32bit.exe \
            --title "${PLUGIN_NAME} v1.1.0 (64-bit + 32-bit)" --notes-file notes.md --latest
